# set -g default-terminal "tmux-256color"
# Allow tmux to pass through graphics protocols (Kitty protocol)
set -g allow-passthrough on

# Inform tmux that the terminal supports image previews
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -as terminal-features ",xterm-256color:RGB"
# set -ag terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ",*:Tc"

set -g prefix C-x
unbind C-b
bind-key C-x send-prefix

unbind %
bind | split-window -h 

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# 🌟 Pane Resizing (Requires Prefix Ctrl-x + Key)
bind j resize-pane -D 6
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

bind -r m resize-pane -Z

bind M-c attach-session -c "#{pane_current_path}"

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'hiroppy/tmux-agent-sidebar'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

# 🌟 Smart Navigation Mappings (Direct Ctrl + Key, NO prefix required)
set -g @vim_navigator_mapping_left  "C-h"
set -g @vim_navigator_mapping_down  "C-j"
set -g @vim_navigator_mapping_up    "C-k"
set -g @vim_navigator_mapping_right "C-l"

set -g @themepack 'powerline/double/cyan'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# config tmux toggle on/off markdown-oxide
bind-key m if-shell "tmux list-panes -F '#{pane_title}' | grep -q notes" \
  "tmux kill-pane -t =notes" \
  "tmux split-window -h -l 60 -c ~/Desktop/DEV/wiki/ 'nvim' \; select-pane -T notes"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
